name: build-and-publish

on:
  push:
    tags: [v*.*.*]
    branches: [feature/enhance] # change to [main] if you want deploys from main

permissions:
  contents: read
  packages: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@totesoft"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Configure pnpm for GitHub Packages
        run: |
          echo "@totesoft:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PACKAGES_TOKEN }}" >> ~/.npmrc

      - name: Create .env.production
        run: |
          cat > .env.production <<'EOF'
          VITE_REPO_NAME=gosecure-certmanager
          VITE_BASE=/gosecure-certmanager/
          VITE_BASE_URL=${{ vars.ORG_BASE_URL }}
          EOF

      - name: Export Vite env
        run: |
          echo "VITE_REPO_NAME=gosecure-certmanager" >> $GITHUB_ENV
          echo "VITE_BASE=/gosecure-certmanager/" >> $GITHUB_ENV
          echo "VITE_BASE_URL=${{ vars.ORG_BASE_URL }}" >> $GITHUB_ENV

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_BASE: "/gosecure-certmanager/"
        run: pnpm build --mode=development

      - name: Add 404.html for SPA
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
